[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "wriml-parser"
version = "0.1.0"
description = "Parseur minimal officiel WRIML v3"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["wriml", "parser", "markup", "ast"]

[project.scripts]
wriml = "wriml.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
